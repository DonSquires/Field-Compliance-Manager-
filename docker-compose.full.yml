# Full FCM stack — replaces docker-compose.api.yml once OSRM data is ready.
# Services: fcm-api, fcm-inference, fcm-voice, osrm (internal), fcm-solver (internal),
#           ollama (internal, in-house embeddings — nomic-embed-text on CPU)
# All on fcm-net bridge network. Only :3001 and :3002 exposed via Nginx.
#
# Embeddings policy: high-frequency, low-complexity embedding calls run IN-HOUSE
# on ollama (CPU) for privacy + zero per-call cost. Heavy reasoning stays on
# OpenAI. This is why ollama is back in the stack (see !592/!593/!595 thread).

services:
  fcm-api:
    build: ./services/fcm-api
    image: fcm/fcm-api:local
    container_name: fcm-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
      # Tailscale-only: lets a technician's own worker (e.g. a laptop CCTV GPU tier) reach the motion-ingestion
      # route directly, without exposing fcm-api to the public internet. Owner ruling 2026-09-21.
      - "${FCM_API_TAILSCALE_IP:-100.85.95.104}:3001:3000"
    env_file: /opt/fcm/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      FCM_API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      # CCTV summaries may contain up to 120 base64 keyframe thumbnails plus
      # classification metadata. Keep the body cap explicit and bounded.
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-268435456}
      OSRM_URL: "http://osrm:5000"
      SOLVER_URL: "http://fcm-solver:5001"
      INFERENCE_SERVICE_URL: "http://fcm-inference:3000"
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      IDENTITY_INFERENCE_SECRET: ${IDENTITY_INFERENCE_SECRET:?set IDENTITY_INFERENCE_SECRET}
      # In-house embeddings (Bob RAG). Reachable by compose service name on fcm-net.
      OLLAMA_URL: "http://ollama:11434"
      EMBED_MODEL: "nomic-embed-text"
      # Self-hosted TTS/STT. Compose service name + INTERNAL port 3000
      # (3003 is only the host-published port). Without this, fcm-api fell back
      # to 127.0.0.1:3003 and bob-voice-speak 502'd. See STAGING.md 2026-07-06.
      VOICE_URL: "http://fcm-voice:3000"
      # Bob's brain runs on the VPS AND the owner's laptop GPU. The laptop keeps a
      # reverse SSH tunnel to the VPS (scripts/bob-gpu-link/) that lands its Ollama
      # on the docker gateway address, so the container reaches it via
      # host.docker.internal. When the laptop is off, the gateway falls back to
      # OpenAI on its own (services/fcm-api/src/bob/modelGateway.js).
      GPU_WORKSTATION_URL: ${GPU_WORKSTATION_URL:-http://host.docker.internal:11435/v1}
      GPU_WORKSTATION_MODEL: ${GPU_WORKSTATION_MODEL:-qwen2.5:7b}
      GPU_WORKSTATION_PLAN_MODEL: ${GPU_WORKSTATION_PLAN_MODEL:-}
      # Per-role provider chains (first healthy wins). The planner (author) stays
      # on OpenAI unless routed in-house on purpose; verifier + subagents prefer
      # the GPU and so keep a different model identity from the author.
      BOB_ROUTE_PLANNER: ${BOB_ROUTE_PLANNER:-openai}
      BOB_ROUTE_VERIFIER: ${BOB_ROUTE_VERIFIER:-gpu_workstation,openai}
      BOB_ROUTE_SUBAGENT: ${BOB_ROUTE_SUBAGENT:-gpu_workstation,openai}
      BOB_ROUTE_SYNTHESIS: ${BOB_ROUTE_SYNTHESIS:-openai}
      BOB_VERIFY_ENABLED: ${BOB_VERIFY_ENABLED:-true}
      BOB_PLAN_TURN_BUDGET_MS: ${BOB_PLAN_TURN_BUDGET_MS:-80000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      fcm-solver:
        condition: service_healthy
      osrm:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  fcm-inference:
    build: ./services/fcm-inference
    image: fcm/fcm-inference:local
    container_name: fcm-inference
    restart: unless-stopped
    init: true
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "127.0.0.1:3002:3000"
    env_file: /opt/fcm/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      VEHICLE_ATTRS_PROVIDER: "basic"
      MODELS_DIR: /app/models
      # CPU tier: RF-DETR small-512 with the 2x2 far-field tile pass; the GPU tier on RunPod runs large-704.
      DETECTOR_MODEL: rf-detr-small-512-coco
      DETECTOR_TILES: auto
      INFERENCE_DEVICE: cpu
      # CPU budget (2026-09-21). ONNX Runtime otherwise takes every core per session and the async routes ran
      # the model on the event loop: with three extractors decoding beside it the server could not answer
      # /health, the watcher's 30 s timeouts fired, and abandoned requests kept being computed. Four threads per
      # session, one request at a time, six queued, the rest refused at once (503) so the caller moves on.
      INFERENCE_INTRA_OP_THREADS: ${INFERENCE_INTRA_OP_THREADS:-4}
      INFERENCE_CONCURRENCY: ${INFERENCE_CONCURRENCY:-1}
      INFERENCE_MAX_WAITING: ${INFERENCE_MAX_WAITING:-6}
      OMP_NUM_THREADS: ${INFERENCE_INTRA_OP_THREADS:-4}
    # Models come from the host, not the image: stage new tiers with
    #   MODELS_DIR=/opt/fcm/models python3 services/fcm-inference/download_models.py
    # or, without a host python:  docker compose -p fcm ... run --rm -v /opt/fcm/models:/app/models -u root fcm-inference python download_models.py
    # (RF-DETR *.onnx + the plate detector/OCR pair are what the entity and ALPR tiers look for; vehicle-detection-0200
    # is only the vehicle-only fallback when no RF-DETR export is present).
    volumes:
      - /opt/fcm/models:/app/models:ro
    healthcheck:
      # -S skips site import; the 30 s allows for a starved host, where starting python took >10 s while the route itself answered in 0.1 s.
      test: ["CMD", "python", "-S", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=8)"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # fcm-voice — self-hosted STT (faster-whisper) + TTS (Piper) for "Hey Bob".
  fcm-voice:
    build: ./services/fcm-voice
    image: fcm/fcm-voice:local
    container_name: fcm-voice
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    env_file: /opt/fcm/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      WHISPER_MODEL: "base"
      WHISPER_DEVICE: "cpu"
      PIPER_VOICE_PATH: "/app/voices/voice.onnx"
    volumes:
      - /opt/fcm/voices:/app/voices:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # fcm-planner — persistent job-plan runner (#86 Phase 3). Polls
  # bob_job_plans/bob_job_plan_steps and advances ready steps via the
  # bob-plan-step-advance edge function (service-role auth). Mirrors fcm-api's
  # block exactly (health check, restart policy, env_file, logging).
  fcm-planner:
    build: ./services/fcm-planner
    image: fcm/fcm-planner:local
    container_name: fcm-planner
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    env_file: /opt/fcm/.env
    environment:
      NODE_ENV: production
      PORT: "3004"
      PLANNER_POLL_INTERVAL_MS: "15000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  osrm:
    image: osrm/osrm-backend:latest
    container_name: osrm
    restart: unless-stopped
    expose: ["5000"]
    volumes:
      - /opt/fcm/osrm-data:/data:ro
    # --max-table-size 200 supports 150-stop shifts + depot
    command: osrm-routed --algorithm mld /data/new-zealand-latest.osrm --max-table-size 200
    # BUGFIX (2026-07-18): the osrm/osrm-backend image has NO wget (or curl)
    # installed -- `docker exec osrm wget ...` fails with "executable file
    # not found in $PATH". This made the healthcheck ALWAYS fail even though
    # the service itself was genuinely healthy and answering real routing
    # queries correctly the whole time (confirmed live via `docker exec
    # fcm-api wget -qO- http://osrm:5000/...` returning a valid waypoints
    # response) -- a false "unhealthy" status for 2+ weeks with no actual
    # functional impact. The osrm-backend image DOES have a plain TCP
    # listener with no HTTP-aware CLI tool baked in, so the healthcheck now
    # uses a bash /dev/tcp probe (bash IS present in this image, unlike
    # wget/curl) to confirm the port accepts connections -- a true positive
    # is good enough here; deep HTTP-response checking is done by fcm-api's
    # own healthcheck + real traffic, not this container's healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  fcm-solver:
    build: ./services/fcm-solver
    image: fcm/fcm-solver:local
    container_name: fcm-solver
    restart: unless-stopped
    expose: ["5001"]
    healthcheck:
      # python:3.11-slim has no wget/curl — use stdlib urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  fcm-vision-watcher:
    build: ./services/vision
    image: fcm/fcm-vision-watcher:local
    container_name: fcm-vision-watcher
    restart: unless-stopped
    # PID 1 is tini (2026-09-21): the watcher spawns extractor processes; without an init, a `docker stop` that
    # node answers slowly leaves the extractors orphaned until the PID namespace is torn down, and Docker can
    # race the shim's reap ("PID … is zombie and can not be killed"). tini forwards signals and reaps children.
    init: true
    env_file: /opt/fcm/.env
    environment:
      VISION_VIDEO_ROOT: /opt/fcm/storage
      VISION_DERIVED_ROOT: /opt/fcm/derived
      VISION_EXTRACTOR_PATH: /app/video_motion_extractor.py
      INFERENCE_SERVICE_URL: http://fcm-inference:3000
      RUNPOD_API_URL: ${RUNPOD_API_URL:-https://api.runpod.ai/v2/katqqnmds1dphs}
      RUNPOD_API: ${RUNPOD_API:-${RUNPOD_API_KEY:-}}
      # Optional dedicated recognition-capture endpoint. Keep separate from the
      # general detector so enhancement/ALPR/face work can be tuned independently.
      RUNPOD_CAPTURE_API_URL: ${RUNPOD_CAPTURE_API_URL:-}
      RUNPOD_CAPTURE_API_KEY: ${RUNPOD_CAPTURE_API_KEY:-${RUNPOD_API_KEY:-}}
      VISION_MAX_CLASSIFICATION_FRAMES: 120
      VISION_MAX_OBSERVATION_DERIVATIVES: ${VISION_MAX_OBSERVATION_DERIVATIVES:-8}
      VISION_RUNPOD_BATCH_SIZE: ${VISION_RUNPOD_BATCH_SIZE:-6}
      # Two jobs at once, two FFmpeg decode threads each (2026-09-21): the extractor used to open one decode
      # thread per core per capture, so three jobs ran 24 decode threads against the detector on eight cores
      # and 1-3 minute clips took twenty minutes to scan. Raise both only on a box with cores to spare.
      VISION_WORKER_CONCURRENCY: ${VISION_WORKER_CONCURRENCY:-2}
      VISION_DECODE_THREADS: ${VISION_DECODE_THREADS:-2}
      OMP_NUM_THREADS: ${VISION_DECODE_THREADS:-2}
      VISION_LOCAL_PEOPLE_INFERENCE: "false"
      VISION_LOCAL_VEHICLE_INFERENCE: "false"
      # Laptop GPU over Tailscale first; VPS CPU next; RunPod only for unanswered frames.
      VISION_INFERENCE_POLICY: ${VISION_INFERENCE_POLICY:-local_gpu_first}
      LOCAL_GPU_INFERENCE_URL: ${LOCAL_GPU_INFERENCE_URL:-}
      LOCAL_GPU_INFERENCE_API_KEY: ${LOCAL_GPU_INFERENCE_API_KEY:-${INFERENCE_API_KEY:-}}
      # The VPS detector shares eight cores with transcoding; two frames in flight per job keeps it responsive.
      VISION_LOCAL_DETECT_CONCURRENCY: ${VISION_LOCAL_DETECT_CONCURRENCY:-2}
      VISION_RUNPOD_TIMEOUT_MS: ${VISION_RUNPOD_TIMEOUT_MS:-90000}
      # Local person/vehicle/animal triage on the VPS (/infer/detect); under vps_first this is the main path.
      VISION_LOCAL_DETECT_INFERENCE: ${VISION_LOCAL_DETECT_INFERENCE:-true}
      # Set per camera after calibration; without this, CCTV reports px/s only.
      VISION_METERS_PER_PIXEL: ${VISION_METERS_PER_PIXEL:-}
      VISION_INGESTION_URL: ${VISION_INGESTION_URL:-}
      # Self-hosted vision-LLM hints (Moondream 2, Apache-2.0) for vehicle make/model guesses and a
      # weapon-shaped-object flag — both unverified, human-review-required. The laptop worker uses its own
      # already-running native Ollama instead (host.docker.internal), so this stays docker-internal only.
      OLLAMA_VISION_URL: "http://ollama:11434"
      OLLAMA_VISION_MODEL: "${OLLAMA_VISION_MODEL:-moondream}"
    volumes:
      - /opt/fcm/storage:/opt/fcm/storage:ro
      - /opt/fcm/vision-derived:/opt/fcm/derived
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # In-house embedding server. CPU-only; nomic-embed-text is small + fast enough
  # for the knowledge-card volume. Not exposed publicly — only fcm-api and fcm-vision-watcher on fcm-net
  # talk to it at http://ollama:11434.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    expose: ["11434"]
    environment:
      # Bob's in-house reviewer/critic models run here on CPU: keep a loaded model resident
      # (a cold load cost ~100 s) and give it a window that fits Bob's prompts without
      # exhausting RAM (16k ctx on a 7-8B model is ~2 GB of KV cache).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2h}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      # ollama has no curl/wget in-image; use its own CLI. `ollama list` returns 0
      # once the server is up (even with no models yet).
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # One-shot: pull nomic-embed-text + moondream into the ollama volume on (re)deploy, then exit. Idempotent —
  # `ollama pull` is a no-op if the model is already present. moondream (Apache-2.0, ~1.7GB, 2B params) is the
  # self-hosted vision-LLM behind the vehicle make/model and weapon-hint enrichment in motion_consolidator.js.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text && ollama pull moondream && echo 'nomic-embed-text + moondream ready'"]
    restart: "no"
    networks: [fcm-net]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

networks:
  fcm-net:
    driver: bridge

  # ── ollama — in-house embeddings (nomic-embed-text, CPU) ──────────────────
  # High-frequency embedding calls for Bob RAG run here, not on OpenAI, for
  # privacy + zero per-call cost. The companion `ollama-init` one-shot pulls the
  # model on startup so nomic-embed-text is always present after a fresh deploy.
  # Persisted to /opt/fcm/ollama so the model survives restarts (no re-download).

volumes:
  ollama-models:
