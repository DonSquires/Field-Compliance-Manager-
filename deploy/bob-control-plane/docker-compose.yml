services:
  bob-control-plane:
    image: node:22-alpine
    container_name: bob-control-plane
    working_dir: /app
    command: ["node", "/app/bob-control-plane-server.js"]
    user: "1000:1000"
    env_file:
      - /root/field-compliance-manager/.env
    environment:
      PORT: "8080"
      BOB_STATE_DIR: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    ports:
      - "172.16.0.1:8091:8080"
    volumes:
      - /root/field-compliance-manager:/app:ro
      - /var/lib/bob:/data
    networks:
      - default
      - gitea_default

networks:
  default:
  gitea_default:
    external: true
