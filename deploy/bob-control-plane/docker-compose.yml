services:
  bob-control-plane:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: fcm-control-plane:current
    container_name: bob-control-plane
    working_dir: /app
    command: ["node", "/app/bob-control-plane-server.js"]
    user: "1000:1000"
    env_file:
      - /var/lib/bob/control-plane.env
    environment:
      PORT: "8080"
      BOB_STATE_DIR: /data
      # Worker bind mounts are resolved by the HOST docker daemon: translate /data -> /var/lib/bob.
      BOB_HOST_DATA_DIR: /var/lib/bob
      # Handoffs stage patches/results in os.tmpdir(); keep it on the data volume so workers can mount it.
      TMPDIR: /data/tmp
      BOB_WORKER_IMAGE: ${BOB_WORKER_IMAGE:-fcm/bob-worker:current}
      # In-house model providers: the VPS Ollama (fcm network) and the laptop GPU (reverse SSH
      # tunnel bound on the host at 11435). Override in control-plane.env; OpenAI stays the fallback.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GPU_WORKSTATION_URL: ${GPU_WORKSTATION_URL:-http://host.docker.internal:11435}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Docker socket access for isolated workers (no-new-privileges, cap-drop ALL, network none).
    group_add:
      - "${DOCKER_GID:-999}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    ports:
      - "172.16.0.1:8091:8080"
    volumes:
      - /var/lib/bob:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - gitea_default
      - fcm_net

networks:
  default:
  gitea_default:
    external: true
  fcm_net:
    external: true
    name: fcm_fcm-net
