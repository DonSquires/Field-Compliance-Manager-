name: Runner test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Atlas and calibration
        run: npm run atlas:check
      - name: Run tests
        run: npm test -- --test-reporter=spec
      - name: Confirm runner
        run: |
          echo "Gitea Actions runner is working"
          uname -a
