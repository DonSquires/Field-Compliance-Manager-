# Second CCTV worker, running the full pipeline (motion extraction + GPU inference) on a technician's own
# GPU laptop instead of the VPS (owner ruling 2026-09-21: shift CCTV load off the VPS now that a local GPU
# tier exists). This claims jobs from the same Supabase queue as the VPS's own fcm-vision-watcher — both
# compete safely via the claim_cctv_inference_job lease, so running this alongside the VPS worker is safe.
#
# Usage:
#   1. Copy deploy/laptop-worker/laptop-worker.env.example to deploy/laptop-worker/laptop-worker.env and fill
#      in the same SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / WORKLOAD_SIGNING_SECRET / VISION_INGESTION_URL
#      already configured on the VPS's /opt/fcm/.env.
#   2. docker compose -f docker-compose.laptop-worker.yml up -d --build

services:
  fcm-inference:
    build:
      context: ./services/fcm-inference
      args:
        GPU: "1"
    image: fcm/fcm-inference:gpu-local
    container_name: fcm-inference-laptop
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      # Tailscale-only: lets the VPS's own vision watcher route triage work here under local_gpu_first,
      # instead of paying for RunPod. Never bind 0.0.0.0 — this API key is shared, not internet-safe.
      - "100.114.240.13:3000:3000"
    environment:
      DETECTOR_MODEL: rf-detr-large-704-coco
      DETECTOR_TILES: auto
      VEHICLE_ATTRS_PROVIDER: basic
      # Shared with the VPS's LOCAL_GPU_INFERENCE_API_KEY so it can call /infer/batch here too.
      INFERENCE_API_KEY: ${LAPTOP_INFERENCE_API_KEY:?LAPTOP_INFERENCE_API_KEY is required}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [fcm-laptop-net]

  fcm-vision-watcher:
    build: ./services/vision
    image: fcm/fcm-vision-watcher:local
    container_name: fcm-vision-watcher-laptop
    restart: unless-stopped
    # tini (PID 1) reaps orphaned ffmpeg/extractor children on stop — same reasoning as docker-compose.full.yml.
    init: true
    env_file: "${LAPTOP_WORKER_ENV_FILE:-./deploy/laptop-worker/laptop-worker.env}"
    environment:
      VISION_VIDEO_ROOT: /opt/fcm/storage
      VISION_DERIVED_ROOT: /opt/fcm/derived
      VISION_EXTRACTOR_PATH: /app/video_motion_extractor.py
      INFERENCE_SERVICE_URL: http://fcm-inference:3000
      INFERENCE_API_KEY: ${LAPTOP_INFERENCE_API_KEY:?LAPTOP_INFERENCE_API_KEY is required}
      LOCAL_GPU_INFERENCE_URL: http://fcm-inference:3000
      LOCAL_GPU_INFERENCE_API_KEY: ${LAPTOP_INFERENCE_API_KEY:?LAPTOP_INFERENCE_API_KEY is required}
      # This instance's own GPU is the local service slot; RunPod receives only frames it cannot answer.
      VISION_INFERENCE_POLICY: vps_first
      RUNPOD_API_URL: ${RUNPOD_API_URL:-https://api.runpod.ai/v2/katqqnmds1dphs}
      RUNPOD_API: ${RUNPOD_API:-${RUNPOD_API_KEY:-}}
      VISION_LOCAL_DETECT_INFERENCE: "true"
      VISION_LOCAL_PEOPLE_INFERENCE: "false"
      VISION_LOCAL_VEHICLE_INFERENCE: "false"
      VISION_WORKER_CONCURRENCY: "1"
      VISION_MAX_CLASSIFICATION_FRAMES: "120"
      VISION_MAX_OBSERVATION_DERIVATIVES: "8"
      VISION_WATCHER_HEALTH_PATH: /tmp/fcm-vision-watcher-health
      VISION_WATCHER_HEALTH_INTERVAL_MS: "10000"
      VISION_WATCHER_HEALTH_MAX_AGE_MS: "90000"
      # This machine already runs its own Ollama (native, GPU-capable) for other work - reuse it via Docker
      # Desktop's host gateway instead of adding a second dockerized instance or a Tailscale hop to the VPS.
      OLLAMA_VISION_URL: "${OLLAMA_VISION_URL:-http://host.docker.internal:11434}"
      OLLAMA_VISION_MODEL: "${OLLAMA_VISION_MODEL:-moondream}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - fcm_laptop_derived:/opt/fcm/derived
    depends_on:
      fcm-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "watcher_healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 45s
    networks: [fcm-laptop-net]

  fcm-document-source-worker:
    build: ./services/document-source-worker
    image: fcm/document-source-worker:local
    container_name: fcm-document-source-worker-laptop
    restart: unless-stopped
    init: true
    env_file: "${LAPTOP_WORKER_ENV_FILE:-./deploy/laptop-worker/laptop-worker.env}"
    environment:
      DOCUMENT_SOURCE_ROOT: /sources/primary
      BOB_DOCUMENT_SOURCE_ALIAS: ${BOB_DOCUMENT_SOURCE_ALIAS:?BOB_DOCUMENT_SOURCE_ALIAS is required}
      DOCUMENT_SOURCE_WORKER_ID: owner-laptop-primary
    volumes:
      - "${BOB_DOCUMENT_ROOT_PATH:?BOB_DOCUMENT_ROOT_PATH is required}:/sources/primary:ro"
    networks: [fcm-laptop-net]

  fcm-rm-source-sync:
    profiles: [rm-source-sync]
    build: ./services/document-source-worker
    image: fcm/document-source-worker:local
    container_name: fcm-rm-source-sync-laptop
    restart: unless-stopped
    init: true
    command: ["node", "/app/source-sync.mjs", "--watch"]
    environment:
      DOCUMENT_SOURCE_ROOT: /sources/primary
      SOURCE_SYNC_STATE_PATH: /state/rm-source-sync.json
      SOURCE_SYNC_INTERVAL_MS: "60000"
      SOURCE_SYNC_INCLUDE_PHOTOS: "true"
    volumes:
      - "${BOB_DOCUMENT_ROOT_PATH:?BOB_DOCUMENT_ROOT_PATH is required}:/sources/primary:ro"
      - fcm_rm_source_sync:/state
    network_mode: none

networks:
  fcm-laptop-net:

volumes:
  fcm_laptop_derived:
  fcm_rm_source_sync:
