name: Mirror GitHub Main to Gitea

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-gitea-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Gitea mirror
        env:
          GITEA_MIRROR_USERNAME: ${{ secrets.GITEA_MIRROR_USERNAME }}
          GITEA_MIRROR_TOKEN: ${{ secrets.GITEA_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITEA_MIRROR_USERNAME"
          test -n "$GITEA_MIRROR_TOKEN"
          auth="$(printf '%s:%s' "$GITEA_MIRROR_USERNAME" "$GITEA_MIRROR_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git config --local http.https://git.fcmanager.co.nz/.extraheader "Authorization: Basic $auth"
          git remote add gitea "https://git.fcmanager.co.nz/Iron-Eagle-Security-Ltd/field-compliance-manager.git"
      - name: Fast-forward Gitea main
        run: |
          set -euo pipefail
          retry_git() {
            local attempt=1
            local max_attempts=4
            local delay_seconds=5

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Gitea mirror command failed after ${attempt} attempts." >&2
                return 1
              fi
              echo "Gitea mirror command failed; retrying in ${delay_seconds}s (attempt $((attempt + 1))/${max_attempts})." >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }

          retry_git git fetch gitea main
          GITEA_MAIN="$(git rev-parse gitea/main)"
          if ! git merge-base --is-ancestor "$GITEA_MAIN" HEAD; then
            echo "Gitea main diverges from GitHub main; refusing to overwrite mirror history." >&2
            exit 1
          fi
          retry_git git push gitea HEAD:refs/heads/main
