name: Release SD Card Bridge

on:
  push:
    tags:
      - 'sd-card-bridge-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sd-card-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sd-card-bridge/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build unsigned Windows installer
        run: npm run tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCM-SD-Card-Bridge-Windows
          path: apps/sd-card-bridge/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish tagged installer release
        if: startsWith(github.ref, 'refs/tags/sd-card-bridge-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/sd-card-bridge/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true