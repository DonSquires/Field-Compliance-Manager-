name: Bob Builder bridge (Gitea bob/job-* -> GitHub draft PRs)

# Bob's self-heal lane publishes verified `bob/job-*` branches to the Gitea
# mirror from the VPS. This job carries them to GitHub — the single target
# build — and opens a DRAFT pull request for human review. It uses only
# credentials the repository already holds: the workflow token (branch push +
# PR creation) and the existing Gitea mirror secrets (read the branches).
# It never merges, never touches main, and never deletes anything.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bob-builder-bridge.yml'

concurrency:
  group: bob-builder-bridge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Bob's verified branches from Gitea
        env:
          GITEA_MIRROR_USERNAME: ${{ secrets.GITEA_MIRROR_USERNAME }}
          GITEA_MIRROR_TOKEN: ${{ secrets.GITEA_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITEA_MIRROR_USERNAME"
          test -n "$GITEA_MIRROR_TOKEN"
          auth="$(printf '%s:%s' "$GITEA_MIRROR_USERNAME" "$GITEA_MIRROR_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git config --local http.https://git.fcmanager.co.nz/.extraheader "Authorization: Basic $auth"
          git remote add gitea "https://git.fcmanager.co.nz/Iron-Eagle-Security-Ltd/field-compliance-manager.git"
          git fetch --prune gitea '+refs/heads/bob/job-*:refs/remotes/gitea/bob/job-*' || echo "no bob/job-* branches on Gitea yet"

      - name: Push branches to GitHub and open draft pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITEA_MIRROR_USERNAME: ${{ secrets.GITEA_MIRROR_USERNAME }}
          GITEA_MIRROR_TOKEN: ${{ secrets.GITEA_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          branches="$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/gitea/bob/job-*' || true)"
          if [ -z "$branches" ]; then
            echo "Nothing to bridge."
            exit 0
          fi
          echo "Bridging $(printf '%s\n' "$branches" | wc -l) branch(es)."
          # The autopilot writes an explanatory pull request on Gitea (what changed, how it was verified);
          # reuse it so reviewers on GitHub read the same account. Same basic credentials as the fetch
          # step (the `token` header scheme silently failed for PR #20 and the body fell back).
          gitea_prs="$(curl -sf -u "$GITEA_MIRROR_USERNAME:$GITEA_MIRROR_TOKEN" 'https://git.fcmanager.co.nz/api/v1/repos/Iron-Eagle-Security-Ltd/field-compliance-manager/pulls?state=all&limit=50' || echo '[]')"
          if [ "$(printf '%s' "$gitea_prs" | jq -r 'length' 2>/dev/null || echo 0)" = "0" ]; then
            echo "::warning::Could not read Bob's pull requests from Gitea; GitHub PR titles/bodies will fall back to the commit message."
          fi
          pr_failures=0
          main_sha="$(git rev-parse origin/main)"
          git config user.name "Bob Builder"
          git config user.email "bob-builder@fieldcompliance.local"
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            case "$branch" in bob/job-*) ;; *) echo "skipping unexpected ref $branch"; continue;; esac
            sha="$(git rev-parse "refs/remotes/gitea/$branch")"
            # A verified Builder branch is pinned to a main commit; refuse unrelated history.
            if ! git merge-base "$sha" "$main_sha" >/dev/null 2>&1; then
              echo "::warning::$branch shares no history with main; skipped"
              continue
            fi
            # The workflow token may not push commits whose workflow files differ from
            # main, and a Builder branch is pinned to an older main. Replay Bob's
            # commits onto the current main so reviewers see an up-to-date branch;
            # the verified original stays on Gitea and is cited in the PR body.
            git checkout -q -B "bridge-tmp" "$sha"
            if ! git rebase -q "$main_sha" >/dev/null 2>&1; then
              git rebase --abort || true
              echo "::warning::$branch does not replay cleanly onto main; review it on Gitea"
              continue
            fi
            rebased="$(git rev-parse HEAD)"
            # Already merged (a human took it in from Gitea): nothing left to review, and GitHub
            # refuses a pull request with no commits, which used to fail every run after a merge.
            if [ "$(git rev-list --count "$main_sha".."$rebased")" = "0" ]; then
              echo "$branch is fully contained in main (${main_sha:0:10}); nothing to bridge"
              continue
            fi
            if [ -n "$(git diff --name-only "$main_sha" "$rebased" -- .github/workflows)" ]; then
              echo "::warning::$branch changes workflow files (protected path); skipped"
              continue
            fi
            if [ "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" != "$rebased" ]; then
              git push --force-with-lease="refs/heads/$branch" origin "$rebased:refs/heads/$branch"
              echo "pushed $branch @ ${rebased:0:10} (verified original ${sha:0:10})"
            fi
            existing="$(gh pr list --repo "$REPO" --head "$branch" --state all --json number --jq 'length')"
            if [ "$existing" = "0" ]; then
              gitea_title="$(printf '%s' "$gitea_prs" | jq -r --arg b "$branch" '[.[] | select(.head.ref == $b)] | sort_by(.number) | last | .title // empty' 2>/dev/null || true)"
              gitea_body="$(printf '%s' "$gitea_prs" | jq -r --arg b "$branch" '[.[] | select(.head.ref == $b)] | sort_by(.number) | last | .body // empty' 2>/dev/null || true)"
              title="${gitea_title:-Bob Builder: $(git log -1 --format=%s "$sha" | sed 's/^Bob Builder: //' | cut -c1-180)}"
              provenance="$(printf '\n\n---\n**Bridge provenance.** Verified head on Gitea: `%s`; replayed onto main `%s` as `%s`. Draft for human review only; it does not authorize a merge or deployment.' "$sha" "${main_sha:0:10}" "$rebased")"
              body="${gitea_body:-$(printf '## Bob Builder review\n\nVerified Builder branch `%s`, published from the VPS via the Gitea mirror.\n\nJob record: builder_jobs where workspace_branch = `%s`.' "$branch" "$branch")}${provenance}"
              if gh pr create --repo "$REPO" --draft --base main --head "$branch" --title "$(printf '%s' "$title" | cut -c1-200)" --body "$body"; then
                echo "opened draft PR for $branch"
              else
                echo "::error::Could not open a pull request for $branch. If the message says GitHub Actions is not permitted to create pull requests, enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General."
                pr_failures=$((pr_failures + 1))
              fi
            fi
          done <<< "$branches"
          if [ "$pr_failures" -gt 0 ]; then
            echo "::error::$pr_failures branch(es) are pushed to GitHub but have no pull request yet."
            exit 1
          fi
