name: PR verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime and migration inventory
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run calibrate
      - run: node scripts/check-migration-versions.js
      - run: node --test --test-concurrency=4 test/*.test.js
      - name: PostgreSQL authorization, biometrics, notice quarantine, permit holders, vehicle notes, places and organisation reach
        run: BOB_TEST_POSTGRES=1 node --test test/builder-chat-research-migration.test.js test/notice-template-quarantine-migration.test.js test/permit-holder-person-search-migration.test.js test/permit-holder-identity-repair-migration.test.js test/officer-person-search-access.test.js test/admin-officer-parity.test.js test/manage-identity-vehicle-notes-migration.test.js test/rm-simple-place-workflows.test.js test/org-access-policy-initplan.test.js test/staff-biometrics-read.test.js

  web:
    name: Web types, build and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --maxWorkers=2 --reporter=dot

  browser:
    name: Offline browser workflows
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      E2E_OFFLINE: '1'
      HUMAN_TEST_LIVE: 'false'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Human-test harness and staff navigation
        run: npx playwright test e2e/human-test-runner.spec.ts e2e/staff-profile-navigation.spec.ts --project=desktop-chromium --workers=2 --global-timeout=600000
      - name: Builder public research consent and attachments (desktop and mobile)
        run: npx playwright test e2e/builder-chat-research.spec.ts --workers=2 --global-timeout=120000
      - name: Existing operational smoke suite
        run: npm run test:e2e:ci-smoke -- --global-timeout=900000
      - name: Admin officer parity and private lookups (desktop and mobile)
        run: npx playwright test e2e/field-operations-role-scope.spec.ts e2e/officer-person-search.spec.ts --workers=2 --global-timeout=120000
      - name: Client and field location workflows (desktop and mobile)
        run: npx playwright test e2e/rm-place-workflows.spec.ts e2e/client-setup.spec.ts --workers=2 --global-timeout=180000
      - name: Retain fixture browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-browser-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
