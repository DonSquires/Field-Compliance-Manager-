name: Release SD Card Bridge V2

on:
  push:
    tags:
      - 'sd-card-bridge-v2-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sd-card-bridge-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sd-card-bridge-v2/package-lock.json
      - name: Install V2 dependencies
        run: npm ci
      - name: Reuse the approved FCM desktop icon set
        shell: pwsh
        run: Copy-Item ../sd-card-bridge/src-tauri/icons src-tauri/icons -Recurse -Force
      - name: Build unsigned development installer
        run: npm run tauri build
      - name: Locate installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'V2 Tauri did not produce an NSIS installer.' }
          Copy-Item $installer.FullName release/FCM-Desktop-V2-Setup.exe
      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCM-Desktop-V2-Windows-Unsigned-Development
          path: apps/sd-card-bridge-v2/release/FCM-Desktop-V2-Setup.exe
          if-no-files-found: error
      - name: Publish V2 release
        if: startsWith(github.ref, 'refs/tags/sd-card-bridge-v2-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/sd-card-bridge-v2/release/FCM-Desktop-V2-Setup.exe
          generate_release_notes: true
          prerelease: true
          body: |
            Unsigned development installer for the FCM Desktop V2 prototype.

            Windows SmartScreen may display a warning because this build does not use a paid code-signing certificate. Verify the release source before installing. Do not use this prototype as the production V1 workstation.
