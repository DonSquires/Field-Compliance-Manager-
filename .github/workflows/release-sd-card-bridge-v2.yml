name: Release SD Card Bridge V2

on:
  push:
    tags:
      - 'sd-card-bridge-v2-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sd-card-bridge-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sd-card-bridge-v2/package-lock.json
      - name: Install V2 dependencies
        run: npm ci
      - name: Reuse the approved FCM desktop icon set
        shell: pwsh
        run: Copy-Item ../sd-card-bridge/src-tauri/icons src-tauri/icons -Recurse -Force
      - name: Prove the DHFS reader against synthetic cards
        run: cargo test --manifest-path crates/dhfs/Cargo.toml
      - name: Build installer
        run: npm run tauri build
      - name: Locate installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'V2 Tauri did not produce an NSIS installer.' }
          Copy-Item $installer.FullName release/FCM-Desktop-V2-Setup.exe

      # Signing happens on the protected side, not here: the certificate lives in Supabase Vault and
      # scripts/desktop-signing/sign-and-publish.mjs signs this artifact and publishes it to desktop-releases.
      # GitHub never holds the private key or a Supabase credential.
      - name: Write integrity manifest (unsigned build)
        id: manifest
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $file = Get-Item release/FCM-Desktop-V2-Setup.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  FCM-Desktop-V2-Setup.exe" | Out-File -FilePath release/SHA256SUMS -Encoding ascii
          $manifest = [ordered]@{
            product = 'FCM Desktop V2'
            version = $version
            file = 'FCM-Desktop-V2-Setup.exe'
            sha256 = $hash
            size_bytes = $file.Length
            git_sha = $env:GITHUB_SHA
            built_at = (Get-Date).ToUniversalTime().ToString('o')
            signed = $false
            next_step = 'node scripts/desktop-signing/sign-and-publish.mjs --tag ' + $env:GITHUB_REF_NAME
            verify = 'certutil -hashfile FCM-Desktop-V2-Setup.exe SHA256'
          }
          $manifest | ConvertTo-Json | Out-File -FilePath release/manifest.json -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Content release/manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCM-Desktop-V2-Windows-Unsigned
          path: |
            apps/sd-card-bridge-v2/release/FCM-Desktop-V2-Setup.exe
            apps/sd-card-bridge-v2/release/SHA256SUMS
            apps/sd-card-bridge-v2/release/manifest.json
          if-no-files-found: error

      - name: Publish V2 release (unsigned; sign on the protected side)
        if: startsWith(github.ref, 'refs/tags/sd-card-bridge-v2-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/sd-card-bridge-v2/release/FCM-Desktop-V2-Setup.exe
            apps/sd-card-bridge-v2/release/SHA256SUMS
            apps/sd-card-bridge-v2/release/manifest.json
          generate_release_notes: true
          prerelease: true
          body: |
            FCM Desktop V2 ${{ steps.manifest.outputs.version }} — Windows installer, **unsigned build output**.

            **SHA-256 (unsigned):** `${{ steps.manifest.outputs.sha256 }}`

            The signed installer is produced on the protected side and published to `desktop-releases/v2/${{ steps.manifest.outputs.version }}/`
            (which the web app links to) by `node scripts/desktop-signing/sign-and-publish.mjs --tag ${{ github.ref_name }}`; that run also
            replaces the assets here with the signed installer, its `SHA256SUMS`, `manifest.json` and the public `FCM-Desktop-Signing.cer`.
            Until then this asset is unsigned: Windows SmartScreen will warn (More info → Run anyway); verify the SHA-256 first.

            Reading a Dahua card needs the app run as administrator. Do not use this prototype as the production V1 workstation.
