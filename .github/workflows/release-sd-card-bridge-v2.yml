name: Release SD Card Bridge V2

on:
  push:
    tags:
      - 'sd-card-bridge-v2-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

jobs:
  build-windows-installer:
    runs-on: windows-latest
    if: ${{ env.HAS_SIGNING_CERT == 'true' }}
    defaults:
      run:
        working-directory: apps/sd-card-bridge-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sd-card-bridge-v2/package-lock.json
      - name: Install V2 dependencies
        run: npm ci
      - name: Build signed-release candidate
        run: npm run tauri build
      - name: Locate installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'V2 Tauri did not produce an NSIS installer.' }
          Copy-Item $installer.FullName release/FCM-Desktop-V2-Setup.exe
      - name: Sign Windows installer
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'fcm-desktop-v2-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found on this runner.' }
          & $signtool.FullName sign /sha1 $imported.Thumbprint /fd sha256 /tr https://timestamp.digicert.com /td sha256 /d "FCM Desktop V2" release/FCM-Desktop-V2-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed to sign the V2 installer.' }
          & $signtool.FullName verify /pa /all /tw release/FCM-Desktop-V2-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool verification failed for the V2 installer.' }
          Remove-Item $pfxPath -Force
      - name: Upload signed V2 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCM-Desktop-V2-Windows-Signed
          path: apps/sd-card-bridge-v2/release/FCM-Desktop-V2-Setup.exe
          if-no-files-found: error
      - name: Publish V2 release
        if: startsWith(github.ref, 'refs/tags/sd-card-bridge-v2-v*')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/sd-card-bridge-v2/release/FCM-Desktop-V2-Setup.exe
          generate_release_notes: true
          prerelease: true
