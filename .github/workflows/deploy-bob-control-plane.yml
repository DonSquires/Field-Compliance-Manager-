name: Deploy Bob Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bob-control-plane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy and verify control plane
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/fcm-vps-key"
          decoded_key="$RUNNER_TEMP/fcm-vps-key-decoded"
          trap 'rm -f "$key_file" "$decoded_key"' EXIT
          umask 077
          key_value="$VPS_SSH_PRIVATE_KEY"
          if [[ "$key_value" == *'\\n'* ]]; then
            key_value="${key_value//\\n/$'\n'}"
          fi
          printf '%s\n' "$key_value" | tr -d '\r' > "$key_file"
          if ! grep -q 'PRIVATE KEY' "$key_file" && printf '%s' "$key_value" | base64 -d > "$decoded_key" 2>/dev/null && grep -q 'PRIVATE KEY' "$decoded_key"; then
            mv "$decoded_key" "$key_file"
          fi
          if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
            echo 'VPS_SSH_PRIVATE_KEY is not a valid private SSH key. Replace the GitHub secret with the complete PEM/OpenSSH private key, including BEGIN/END lines.' >&2
            exit 2
          fi
          # Public half of the deploy key; must be present in the VPS root authorized_keys.
          echo 'Deploy key public half:'
          ssh-keygen -y -f "$key_file"
          if ! ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 root@72.61.123.97 true; then
            echo 'VPS rejected the deploy key. Append the public key printed above to /root/.ssh/authorized_keys on 72.61.123.97.' >&2
            exit 3
          fi
          # Guards against re-runs of commits that predate the checkout step, which shipped an empty archive.
          if [[ ! -f deploy/bob-control-plane/docker-compose.yml || ! -f bob-control-plane-server.js ]]; then
            echo 'Runner workspace is missing deploy sources. Start a fresh "Run workflow" on main rather than re-running an older run.' >&2
            exit 4
          fi
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./node_modules' \
            --exclude='./apps/*/node_modules' \
            --exclude='./apps/*/dist' \
            --exclude='./apps/*/test-results' \
            --exclude='./apps/*/playwright-report' \
            --exclude='./.bob' \
            --exclude='./bob-data' \
            -czf - . | ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@72.61.123.97 \
            'mkdir -p /root/field-compliance-manager && tar -xzf - -C /root/field-compliance-manager'
          ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@72.61.123.97 \
            'cd /root/field-compliance-manager && docker compose -f deploy/bob-control-plane/docker-compose.yml up -d --force-recreate bob-control-plane && curl --fail --silent --show-error http://172.16.0.1:8091/health'