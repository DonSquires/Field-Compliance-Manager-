name: Deploy Bob Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bob-control-plane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy and verify control plane
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/fcm-vps-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key_file"
          ssh -i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@72.61.123.97 \
            'cd /root/field-compliance-manager && git pull --ff-only origin main && docker compose -f deploy/bob-control-plane/docker-compose.yml up -d --force-recreate bob-control-plane && curl --fail --silent --show-error http://127.0.0.1:8091/health'