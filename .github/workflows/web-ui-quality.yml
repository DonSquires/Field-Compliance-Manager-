name: Web UI Quality

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ui-quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-ui-quality.yml'

concurrency:
  group: web-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck and build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
      - name: Unit and source guards
        run: npm test -- --run
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
      - name: Browser interactions and visual regression
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
