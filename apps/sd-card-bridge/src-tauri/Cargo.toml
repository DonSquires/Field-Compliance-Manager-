[package]
name = "fcm-sd-card-bridge"
version = "0.1.38"
description = "Read-only local SD-card evidence bridge for Field Compliance Manager"
authors = ["Field Compliance Manager"]
edition = "2021"

[lib]
name = "fcm_sd_card_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"