[package]
name = "fcm-sd-card-bridge-v2"
version = "0.4.4"
description = "FCM Desktop V2 read-only acquisition prototype"
authors = ["Field Compliance Manager"]
edition = "2021"

[lib]
name = "fcm_sd_card_bridge_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.22"
fcm-decoder = { path = "../crates/decoder" }
fcm-dhfs = { path = "../crates/dhfs" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.1", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
ureq = { version = "2", default-features = false, features = ["tls"] }
