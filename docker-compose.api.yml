services:
  fcm-api:
    build: ./services/fcm-api
    image: fcm/fcm-api:local
    container_name: fcm-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - /opt/fcm/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      FCM_API_TOKEN: ${API_TOKEN:?set API_TOKEN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fcm-inference:
    build: ./services/fcm-inference
    image: fcm/fcm-inference:local
    container_name: fcm-inference
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - /opt/fcm/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      VEHICLE_ATTRS_PROVIDER: "basic"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
